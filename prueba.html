<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Petit à Petit - Florería</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" href="Imagenes/logo.png" type="image/png" sizes="16x16">
        <link rel="stylesheet" href="CSS/pedido.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
    </head>
    <body>
        <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-cafe shadow-lg sticky-top">
            <div class="container-fluid">
            <div class="logo">
                <img src="imagenes/logo.png" alt="Logo Petit à Petit">
                <h1>Petit à Petit</h1>
            </div>

            <button class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" 
                    aria-expanded="false" 
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                <li class="nav-item">
                    <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="display: inline; margin-right: 15px;"><a href="index.html">Inicio</a></li>
                    <li style="display: inline; margin-right: 15px;"><a href="menu.html">Novedades</a></li>
                    <li style="display: inline; margin-right: 15px;"><a href="historia.html">Nosotros</a></li>
                    <li style="display: inline;"><a href="catalogo.html">Catálogo</a></li>
                    </ul>
                </li>
                </ul>
            </div>
            </div>
        </nav>
        </header>
        <main>
        <div class="container-formulario">
            <h2>Realiza tu Pedido</h2>

            <form id="pedidoForm">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required />

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required />

            <label for="producto">Producto:</label>
            <select id="producto" name="producto" required>
                <option value="">-- Selecciona un producto --</option>
                <option value="ramo">Ramo de flores</option>
                <option value="caja">Caja floral</option>
                <option value="arreglo">Arreglo especial</option>
            </select>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required />

            <label for="direccion">Dirección de envío:</label>
            <textarea id="direccion" name="direccion" rows="3" required></textarea>

            <button type="submit">Enviar Pedido</button>
            </form>
            <div id="mensaje"></div>
        </div>
        </main>
        <script src="JavaScript/script.js"></script>
            <footer>
                <p>&copy; 2025 Florería Petit à Petit | Todos los derechos reservados</p>
                <p>🌸 Síguenos en <a href="#">Instagram</a> | <a href="#">Facebook</a></p>
            </footer>
    </body>
</html>
