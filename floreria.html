<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petit à Petit 🌸</title>
    <link rel="stylesheet" href="CSS/floreria-estilo.css" />
    <script defer src="JavaScript/floreria-funciones.js"></script>
</head>
<body>
    <header>
        <h1>🌷 Petit à Petit</h1>
        <button class="hamburguesa" aria-label="Abrir menú" onclick="toggleMenu()">☰</button>
        <nav>
            <ul>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#carrito">Carrito</a></li>
                <li><a href="#reserva">Reservación</a></li>
                <li><a href="#ubicacion">Ubicación</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 🌸 Catálogo -->
        <section id="catalogo" class="seccion">
            <h2>Catálogo de Arreglos Florales</h2>
            <div class="filtros">
                <button onclick="filtrarProductos('todos')">Todos</button>
                <button onclick="filtrarProductos('ramos')">Ramos</button>
                <button onclick="filtrarProductos('cajas')">Cajas</button>
                <button onclick="filtrarProductos('plantas')">Plantas</button>
            </div>
            <div id="productos" class="grid"></div>
        </section>

        <!-- 🛒 Carrito -->
        <section id="carrito" class="seccion">
            <h2>🛍️ Tu Carrito</h2>
            <ul id="lista-carrito"></ul>
            <p id="total">Total: $0</p>
        </section>

        <!-- 📅 Reservación -->
        <section id="reserva" class="seccion">
            <h2>Reservaciones o Pedidos Anticipados</h2>
            <form id="reservaForm">
                <input type="date" id="fecha" required />
                <input type="time" id="hora" required />
                <input type="number" id="personas" min="1" placeholder="Cantidad de arreglos" required />
                <button type="submit">Reservar</button>
            </form>
            <p id="mensaje"></p>
        </section>

        <!-- 📍 Ubicación -->
        <section id="ubicacion" class="seccion">
            <h2>Encuéntranos</h2>
            <div id="mapa"></div>
            <button onclick="abrirMapa()">Ver en Google Maps</button>
        </section>

        <!-- 📧 Contacto -->
        <section id="contacto" class="seccion">
            <h2>Contáctanos</h2>
            <form id="contactoForm">
                <input type="text" id="nombre" placeholder="Tu nombre" required />
                <input type="email" id="correo" placeholder="Tu correo" required />
                <textarea id="mensaje" placeholder="Tu mensaje" required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-contenido">
            <span onclick="cerrarModal()" class="cerrar">&times;</span>
            <img src="" alt="Producto" />
            <h2></h2>
            <p></p>
            <button id="btnAgregar">Agregar al carrito</button>
        </div>
    </div>

    <footer>
        <p>🌸 Petit à Petit - Donde florecen los detalles 🌸</p>
    </footer>
</body>
</html>
