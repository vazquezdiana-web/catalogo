        <main>
            <div class="text-size-controls text-center mt-3" aria-label="Controles de tamaño de texto">
                <button class="btn-size" id="decreaseText" aria-label="Disminuir tamaño del texto">A-</button>
                <button class="btn-size" id="resetText" aria-label="Restablecer tamaño del texto">A</button>
                <button class="btn-size" id="increaseText" aria-label="Aumentar tamaño del texto">A+</button>
            </div>
            <!-- 🩷 Sección de Pedido -->
            <section class="pedido-container">
                <h2>Realiza tu Pedido</h2>
                <form id="pedidoForm" action="guardar_pedido.php" method="POST">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="producto">Producto:</label>
                    <select id="producto" name="producto" required>
                        <option value="">-- Selecciona un producto --</option>
                        <option value="regalo">Regalo</option>
                        <option value="ramo">Ramo</option>
                        <option value="peluche">Peluche</option>
                    </select>

                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" required>

                    <p><strong>Total:</strong> <span id="total_pedido">--</span></p>

                    <label for="direccion">Dirección de envío:</label>
                    <textarea id="direccion" name="direccion" required></textarea>

                    <button type="submit">Enviar Pedido</button>
                </form>
                <div id="mensaje-pedido"></div>
            </section>

            <!-- 🌸 Sección de Reserva -->
            <section id="reserva" class="reserva-container">
                <h2>Reservaciones o Pedidos Anticipados</h2>
                <form id="reservaForm">
                    <label for="fecha">Fecha de entrega:</label>
                    <input type="date" id="fecha" required>

                    <label for="hora">Hora de entrega:</label>
                    <input type="time" id="hora" required>

                    <label for="personas">Cantidad de arreglos:</label>
                    <input type="number" id="personas" min="1" required>

                    <button type="submit">Reservar</button>
                </form>
                <p id="mensaje-reserva"></p>
            </section>
        </main>

                crossorigin="anonymous"></script>

        <!-- FUNCIÓN PARA CAMBIAR EL TAMAÑO DEL TEXTO -->
        <script>
            const root = document.documentElement;
            let currentSize = 100;

            document.getElementById("increaseText").addEventListener("click", () => {
                currentSize += 10;
                root.style.fontSize = currentSize + "%";
            });

            document.getElementById("decreaseText").addEventListener("click", () => {
                if (currentSize > 80) {
                    currentSize -= 10;
                    root.style.fontSize = currentSize + "%";
                }
            });

            document.getElementById("resetText").addEventListener("click", () => {
                currentSize = 100;
                root.style.fontSize = "100%";
            });
        </script>
    </body>
