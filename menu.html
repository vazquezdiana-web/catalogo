<!DOCTYPE html>
<html>
    <head> <!--Este código está basado principalmente en el diseño de la exposición-->
        <title>Petit à Petit - Florería</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="Imagenes/logo.png" type="image/png" sizes="16x16">
        <link rel="stylesheet" href="CSS/menu.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        <style>
            /* Definición de colores base inspirados en el café */

            .bg-cafe {
            background-color: #f8d1df; /* Tono marrón oscuro */
            }
            .text-grano {
            color: #8b2b56; /* Tono beige claro/arena */
            }
        </style>
    </head>
    <body>
        <header>
            <!-- BARRA DE NAVEGACIÓN (Navbar Responsive de Bootstrap) -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-cafe shadow-lg sticky-top">
                <div class="container-fluid">
<!-- Nombre de la cafetería -->
                <div class="logo">
                    <img src="imagenes/logo.png" alt="Logo Petit à Petit">
                    <h1>Petit à Petit</h1>
                </div>
                    <button class="navbar-toggler" 
                        type="button" 
                        data-bs-toggle="collapse" 
                        data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" 
                        aria-expanded="false" 
                        aria-label="Abrir menú de navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <!-- Lista de enlaces de navegación -->
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <ul style="list-style: none; padding: 0;">
                        <li style="display: inline; margin-right: 15px;"><a href="index.html">Inicio</a></li>
                        <li style="display: inline; margin-right: 15px;"><a href="menu.html">Novedades</a></li>
                        <li style="display: inline; margin-right: 15px;"><a href="historia.html">Nosotros</a></li>
                        <li style="display: inline;"><a href="catalogo.html">Catálogo</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <script 
                src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
                crossorigin="anonymous">
            </script>
        </header>
        <section class="actualizacion">
            <h2>Recientes</h2>
        </section>
            <div class="text-size-controls text-center mt-3" aria-label="Controles de tamaño de texto">
                    <button class="btn-size" id="decreaseText" aria-label="Disminuir tamaño del texto">A-</button>
                    <button class="btn-size" id="resetText" aria-label="Restablecer tamaño del texto">A</button>
                    <button class="btn-size" id="increaseText" aria-label="Aumentar tamaño del texto">A+</button>
            </div>
        <main>
            <div class="contenido-flexible">
                <section class="galeria">
                    <img src="Imagenes/producto.jpeg" alt="Arreglo 1">
                    <img src="Imagenes/producto2.jpeg" alt="Arreglo 2">
                    <img src="Imagenes/producto3.jpeg" alt="Arreglo 3">
                    <img src="Imagenes/producto4.jpeg" alt="Arreglo 4">
                    <img src="Imagenes/producto5.jpg" alt="Arreglo 5">
                    <img src="Imagenes/producto6.jpeg" alt="Arreglo 6">
                    <img src="Imagenes/producto7.jpeg" alt="Arreglo 7">
                    <img src="Imagenes/producto8.jpeg" alt="Arreglo 8">
                    <img src="Imagenes/producto8.jpeg" alt="Arreglo 9">
                </section>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 Florería Petit à Petit | Todos los derechos reservados</p>
            <p>🌸 Síguenos en <a href="#">Instagram</a> | <a href="#">Facebook</a></p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-NZczrI7lWZXhDndP0rO7HSlVQkWlETzSloZYZr7bGkN9UyZ5nUFKQ5KQfFFY9xvW" 
                crossorigin="anonymous"></script>

        <!-- FUNCIÓN PARA CAMBIAR EL TAMAÑO DEL TEXTO -->
        <script>
            const root = document.documentElement;
            let currentSize = 100;

            document.getElementById("increaseText").addEventListener("click", () => {
                currentSize += 10;
                root.style.fontSize = currentSize + "%";
            });

            document.getElementById("decreaseText").addEventListener("click", () => {
                if (currentSize > 80) {
                    currentSize -= 10;
                    root.style.fontSize = currentSize + "%";
                }
            });

            document.getElementById("resetText").addEventListener("click", () => {
                currentSize = 100;
                root.style.fontSize = "100%";
            });
        </script>
    </body>
</html>
